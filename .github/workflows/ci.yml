name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Jest (integrity, smoke, e2e flow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx jest --ci
      - name: Android release JS bundle builds
        run: npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output /tmp/index.android.bundle --assets-dest /tmp/assets
